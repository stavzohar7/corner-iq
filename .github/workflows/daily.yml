name: פרסום האתר

# הנתונים מחושבים על המחשב של הבעלים (scripts/auto.mjs, כל שעה) ונדחפים לכאן; ה-workflow רק מפרסם אותם ב-GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: הכנת קבצי האתר
        run: |
          mkdir -p _site
          cp -r index.html assets _site/
          mkdir -p _site/data
          cp -r data/days data/bball data/latest.json data/stats.json data/slips.json data/teams.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
