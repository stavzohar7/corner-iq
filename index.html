<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101112">
<title>קורנר IQ — ניתוח יומי</title>
<meta name="description" content="ההמלצות הכי טובות של היום: קרנות, בעיטות, בעיטות למסגרת, שערים ומנצחת, לפי סטטיסטיקה.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚩</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand">
      <span class="logo">🚩</span>
      <div>
        <h1>קורנר IQ</h1>
      </div>
    </div>
    <div class="daybox">
      <select id="daySel" aria-label="בחירת יום"></select>
      <span id="updated" class="muted"></span>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab active" data-tab="today"><span class="ti">🏆</span><span class="tl">היום</span></button>
    <button class="tab" data-tab="games"><span class="ti">⚽</span><span class="tl">משחקים</span></button>
    <button class="tab" data-tab="bball"><span class="ti">🏀</span><span class="tl">כדורסל</span></button>
    <button class="tab" data-tab="leagues"><span class="ti">📚</span><span class="tl">ליגות</span></button>
    <button class="tab" data-tab="track"><span class="ti">📊</span><span class="tl">מעקב</span></button>
    <button class="tab" data-tab="more"><span class="ti">🎯</span><span class="tl">ניחושים<span class="tlx"> בין חברים</span></span></button>
  </nav>
</header>

<div id="banners"></div>

<main>
  <section id="view-today" class="view"></section>
  <section id="view-games" class="view" hidden></section>
  <section id="view-tables" class="view" hidden></section>
  <section id="view-teams" class="view" hidden></section>
  <section id="view-bball" class="view" hidden></section>
  <section id="view-guess" class="view" hidden></section>
  <section id="view-track" class="view" hidden></section>
  <section id="view-about" class="view" hidden></section>
  <section id="view-match" class="view" hidden></section>
</main>

<footer class="foot">
  <p>⚠️ ניתוח סטטיסטי בלבד, ואינו מבטיח רווח. הימרו באחריות ורק בסכום שאפשר להפסיד. 18+. יחס שכתוב "Bet365" נמשך מ-Bet365; "משוער" = אין קו כזה אצלה. בדקו תמיד את היחס העדכני.</p>
  <p class="muted" id="srcLine"></p>
</footer>
<div id="tip" class="tip" hidden></div>
<script src="assets/app.js"></script>
</body>
</html>
